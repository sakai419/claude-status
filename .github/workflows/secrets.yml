name: secrets

# リポジトリと git 履歴に秘密情報 (鍵・トークン・接続文字列など) が入っていないかを gitleaks で確認する。

on:
  push:
    branches:
      - main
  pull_request:

# 同じブランチで走っている古い実行は、PR なら取り消す (main への push は取り消さない)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 公式イメージを digest で固定して使う (Dependabot は docker run の版を追えないので、更新は手動)。
      - name: gitleaks
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1
